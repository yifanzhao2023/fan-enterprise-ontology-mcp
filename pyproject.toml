[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beomcp"
version = "0.1.0"
description = "MCP server exposing an enterprise ontology as an agent semantic memory layer"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "mcp>=1.2.0",
  "neo4j>=5.26.0",
  "rdflib>=7.1.0",
  "pyshacl>=0.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "testcontainers[neo4j]>=4.8.0"]

[project.scripts]
beomcp = "beomcp.server:main"
onto = "beomcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/beomcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
