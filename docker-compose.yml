services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

# No APOC: the Cypher guard rejects every apoc.* call, and leaving the plugin
# out means the database cannot run one either (defence in depth) and the stack
# needs no download from Neo4j's plugin site at startup.
#
# ABox export is done by Neo4jStore.materialize_rdf in Python (rdflib), not by
# neosemantics. The n10s 5.26.0 jar shades a Jackson that clashes with Neo4j's
# own and takes the server down at boot, so the plugin is deliberately absent —
# which also means no `n10s.*` procedure needs to be unrestricted.

volumes:
  neo4j-data:
